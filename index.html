<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redesigned Website</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: transparent;
        }
        .navbar a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .hero {
            background-image: url('path_to_reconstructed_leather_bag_image.jpg');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .content {
            padding: 20px;
            margin: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><img src="path_to_logo.png" alt="Logo" style="width: 50px;"></div>
        <nav>
            <a href="#hautecouture">Haute Couture</a>
            <a href="#cutandsew">Cut and Sew</a>
            <a href="#consultation">Set a Consultation</a>
            <a href="#contact">Contact Us</a>
        </nav>
    </div>
    <div class="hero">
        <h1>Explore Our Collection</h1>
    </div>
    <div class="content">
        <h2>Welcome to Our Elegant Store</h2>
        <p>Located in London</p>
        <p>Discover the finest designs with a punk elevated aesthetic.</p>
    </div>
</body>
</html>
