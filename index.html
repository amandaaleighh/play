<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redesigned Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Loud+Few&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Loud Few', sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .logo {
            font-size: 2em;
        }
        nav {
            display: flex;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .hero {
            background: url('path/to/leather-bag-image.jpg') no-repeat center center;
            background-size: cover;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .hero h1 {
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Logo</div>
        <nav>
            <a href="#haute-couture">Haute Couture</a>
            <a href="#cut-and-sew">Cut and Sew</a>
            <a href="#set-a-consultation">Set a Consultation</a>
            <a href="#contact-us">Contact Us</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Welcome to Our London Studio</h1>
    </section>
    <footer>
        <p>Located in London</p>
    </footer>
</body>
</html>
